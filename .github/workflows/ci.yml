# CI for the action's own repository.
#
# The dist check is the one that earns its keep. A JavaScript action runs the
# COMMITTED bundle, not the source: edit `src/`, forget `npm run build`, and
# every consumer keeps running the previous version while the repository shows
# the new one. Nothing else in this file would catch that, and no reviewer
# reliably catches it either, so it is a job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node24 is what the action declares (GitHub removed node20 from the
        # runners on 2026-09-23); node22 is the oldest LTS a contributor is
        # likely to run the suite on. Both, on all three runner images, because
        # a path separator bug on Windows is otherwise found by a customer.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  dist:
    name: dist is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ differs from a fresh build
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

  self-test:
    name: the action validates its own fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the SARIF upload below, the check this job skipped until 1.4.0.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # The action, used as a consumer would use it, against the fixtures that
      # are supposed to pass.
      - id: clean
        uses: ./
        with:
          files: |
            test/fixtures/*.xml
            test/fixtures/*.pdf
            !test/fixtures/not-an-invoice.xml
            !test/fixtures/*-missing-buyer-reference.xml
            !test/fixtures/facturx-minimum-rechnung.pdf
          sarif: einvoice.sarif

      - name: A clean fixture set must report valid with zero errors, in one SARIF run
        run: |
          test "${{ steps.clean.outputs.valid }}" = "true"
          test "${{ steps.clean.outputs.error-count }}" = "0"
          test "${{ steps.clean.outputs.file-count }}" = "4"
          test "$(jq '.runs | length' einvoice.sarif)" = "1"
          test "$(jq '.runs[0].artifacts | length' einvoice.sarif)" = "4"

      # This workflow wrote SARIF and never uploaded it, so nothing noticed when
      # upload-sarif began refusing a file with several runs of one tool and
      # category (July 2025), which is what the action wrote for two or more
      # documents. The upload is the check. A pull request from a fork gets no
      # security-events permission and skips it; the suite's upload checks in
      # test/sarif-check.js run there instead.
      - name: GitHub code scanning accepts the SARIF
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: einvoice.sarif
          category: self-test

      # And the negative control: the broken fixture must fail the step. Without
      # this, a build of the action that found nothing at all would pass above.
      - id: broken
        continue-on-error: true
        uses: ./
        with:
          files: test/fixtures/xrechnung-ubl-missing-buyer-reference.xml
          sarif: broken.sarif

      - name: The broken fixture must fail the step, and be located on its line
        run: |
          test "${{ steps.broken.outcome }}" = "failure"
          test "${{ steps.broken.outputs.valid }}" = "false"
          test "${{ steps.broken.outputs.error-count }}" = "1"
          test "$(jq '.runs[0].results[0].locations[0].physicalLocation.region.startLine' broken.sarif)" = "2"
